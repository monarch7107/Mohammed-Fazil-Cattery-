name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Typecheck (strict, platform command)
        run: bunx tsc -b --noEmit

      - name: Production build
        run: bunx next build

      - name: Smoke test — public routes, 404 and auth guard
        run: |
          set -u
          bunx next start -H 127.0.0.1 -p 3000 > server.log 2>&1 &
          echo $! > server.pid

          ready=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/robots.txt; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then echo "Server did not become ready"; cat server.log; exit 1; fi

          fail=0
          for path in / /kittens /pet-food /about /gallery /contact /admin/login /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$path")
            echo "$code  $path"
            if [ "$code" != "200" ]; then fail=1; fi
          done

          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/this-route-does-not-exist)
          echo "$code  /this-route-does-not-exist (expect 404)"
          [ "$code" = "404" ] || fail=1

          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/admin/stats)
          echo "$code  /api/admin/stats (expect 401)"
          [ "$code" = "401" ] || fail=1

          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/kittens)
          echo "$code  /api/kittens (expect 200)"
          [ "$code" = "200" ] || fail=1

          echo "--- server log tail ---"
          tail -20 server.log

          if [ "$fail" != "0" ]; then echo "Smoke test failed"; exit 1; fi
          echo "Smoke test passed"
